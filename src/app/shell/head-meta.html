<style>
/* Finance.ttf not bundled — falls back cleanly to Syne/DM Sans */

/* ── ADVISOR CARDS ───────────────────────────────────────── */
.advisor-card{background:rgb(var(--teal-rgb) / .05);border:1px solid rgb(var(--teal-rgb) / .15);border-left:3px solid var(--em);border-radius:6px;padding:12px 16px;margin:0 0 20px;font-size:max(.72rem,var(--vi-fs-3));color:var(--t2);line-height:1.65}
.advisor-name{font-family:'Syne',sans-serif;font-weight:700;font-size:max(.58rem,var(--vi-fs-0));letter-spacing:.18em;text-transform:uppercase;color:var(--em);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.advisor-card.gold{border-left-color:var(--go);background:rgb(var(--brass-rgb) / .04)}
.advisor-card.gold .advisor-name{color:var(--go)}
.advisor-card.orange{border-left-color:var(--or);background:rgb(var(--orange-rgb) / .04)}
.advisor-card.orange .advisor-name{color:var(--or)}
.advisor-disc{font-size:max(.54rem,var(--vi-fs-1));color:var(--t3);margin-top:7px;font-style:italic}
/* ── WAITLIST MODAL ─────────────────────────────────────── */
.waitlist-email-input{width:100%;padding:10px 14px;background:var(--c3);border:1px solid var(--bd2);border-radius:5px;color:var(--tx);font-family:'Share Tech Mono',monospace;font-size:max(.8rem,var(--vi-fs-3));margin-bottom:12px;box-sizing:border-box}
.waitlist-email-input:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 2px rgb(var(--teal-rgb) / .1)}
/* ── DEMO CHIP ───────────────────────────────────────── */
.demo-chip{background:rgb(var(--brass-rgb) / .12);border-bottom:1px solid rgb(var(--brass-rgb) / .25);padding:7px 16px;font-family:'Share Tech Mono',monospace;font-size:12px;color:rgb(var(--brass-rgb) / .85);letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:500}
.demo-chip .demo-chip-left{display:flex;align-items:center;gap:8px}
.demo-chip button{background:none;border:none;color:var(--go);font-family:inherit;font-size:inherit;cursor:pointer;text-decoration:underline;padding:0}
.demo-chip .demo-signup-btn{background:rgb(var(--brass-rgb) / .18);border:1px solid rgb(var(--brass-rgb) / .4);color:var(--brass);font-family:'Share Tech Mono',monospace;font-size:11px;padding:4px 12px;border-radius:4px;cursor:pointer;letter-spacing:.08em;text-decoration:none;white-space:nowrap}
.demo-chip .demo-signup-btn:hover{background:rgb(var(--brass-rgb) / .28)}
/* ── PWA INSTALL BANNER ──────────────────────────────── */
#pwa-install-banner{background:rgb(var(--teal-rgb) / .08);border-bottom:1px solid rgb(var(--teal-rgb) / .15);padding:6px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'Share Tech Mono',monospace;font-size:max(.46rem,var(--vi-fs-1));color:var(--t2)}
#pwa-install-banner button.install-btn{padding:4px 12px;background:var(--em);border:none;color:#080808;font-family:'Syne',sans-serif;font-size:max(.5rem,var(--vi-fs-1));font-weight:800;cursor:pointer;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,4px 100%,0 calc(100% - 4px))}
/* v0.9.2: in Daylight the install banner keeps the Night look (solid dark behind it, as on the dark page) */
[data-theme="light"] #pwa-install-banner{background:linear-gradient(rgb(var(--teal-rgb) / .08),rgb(var(--teal-rgb) / .08)),var(--bg)}
#pwa-install-banner button.dismiss-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:max(.7rem,var(--vi-fs-3));padding:0 4px}
/* ── SETTINGS WCAG ───────────────────────────────────── */
.settings-section{margin-bottom:18px}
.settings-section-title{font-family:'Syne',sans-serif;font-size:max(.66rem,var(--vi-fs-2));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.settings-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.settings-label{font-family:'DM Sans',sans-serif;font-size:max(.58rem,var(--vi-fs-2));color:var(--t2);min-width:90px;flex-shrink:0}
.settings-opts{display:flex;gap:4px;flex-wrap:wrap}
.settings-opts button{padding:4px 10px;background:var(--c3);border:1px solid var(--bd);clip-path:polygon(0 0,calc(100% - 3px) 0,100% 3px,100% 100%,3px 100%,0 calc(100% - 3px));color:var(--t2);font-family:'Syne',sans-serif;font-size:max(.5rem,var(--vi-fs-1));font-weight:700;cursor:pointer;transition:all .15s}
.settings-opts button:hover{border-color:var(--em);color:var(--tx)}
.settings-opts button.active{background:rgb(var(--teal-rgb) / .1);border-color:var(--em);color:var(--em)}
/* v0.9.2 Settings cleanup: one section heading, one card heading, one primary button per card, destructive actions as red outline only (Pedro 8, 9, 11, 12) */
.settings-section{margin-bottom:20px}
.set-box{padding:14px;margin-bottom:16px;background:rgb(var(--teal-rgb) / .04);border:1px solid rgb(var(--teal-rgb) / .2);border-radius:8px}
.set-btns{display:flex;gap:8px;flex-wrap:wrap}
.set-btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;min-height:36px;background:transparent;border:1px solid var(--bd2);border-radius:5px;color:var(--tx);font-family:'Syne',sans-serif;font-size:max(.66rem,var(--vi-fs-2));font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2}
.set-btn:hover{border-color:var(--em);color:var(--em)}
.set-btn.primary{background:rgb(var(--teal-rgb) / .12);border-color:var(--em);color:var(--em)}
.set-btn.danger{display:flex;width:100%;margin-bottom:8px;border-color:var(--red);color:var(--red);background:transparent}
.set-btn.danger:hover{background:rgba(224,92,92,.1)}
.set-btn:focus-visible,.settings-opts button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.set-acct{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.set-acct-email{font-family:'Share Tech Mono',monospace;font-size:max(.7rem,var(--vi-fs-3));color:var(--tx);overflow-wrap:anywhere}
.set-plan{padding:16px;background:linear-gradient(135deg,rgb(var(--brass-rgb) / .07),rgb(var(--brass-rgb) / .02));border-radius:10px;border:1px solid rgb(var(--brass-rgb) / .35)}
.set-plan-h{font-family:'Syne',sans-serif;font-weight:800;font-size:max(.7rem,var(--vi-fs-3));color:var(--tx);letter-spacing:.06em}
.set-plan-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.set-foot{display:flex;margin-top:4px}.set-foot .set-btn{flex:1}
.set-owner-test{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.set-locked-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:max(.7rem,var(--vi-fs-3));color:var(--go)}
.set-locked-head .vi-ic{width:14px;height:14px}
#set-locked-list .sl-cat{font-family:'Syne',sans-serif;font-weight:700;font-size:max(.66rem,var(--vi-fs-2));letter-spacing:.06em;color:var(--tx);margin:8px 0 4px}
#set-locked-list .sl-names{display:flex;flex-wrap:wrap;gap:4px}
#set-locked-list .sl-n{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--bd);border-radius:999px;color:var(--t2);font-size:max(.66rem,var(--vi-fs-2));cursor:default;user-select:none}
#set-locked-list .sl-n .vi-ic{width:10px;height:10px;opacity:.7}
#settings-modal{z-index:1200!important}
/* Night contrast (Pedro's audit, 5 Nov): sidebar currency switcher, Settings button, VAULT-IT tab and plan price suffixes reach 4.5:1 on the dark panel. Daylight unchanged. */
[data-theme="dark"] #left-sidebar button[data-c]{color:rgb(var(--teal-rgb) / .9)!important}
[data-theme="dark"] #left-sidebar button[data-c].active{color:var(--em)!important}
[data-theme="dark"] #left-sidebar button[onclick="showSettings()"]{color:var(--muted)!important}
[data-theme="dark"] #sidebar-toggle,[data-theme="dark"] #sidebar-toggle *{opacity:1!important}
[data-theme="dark"] .set-tier-price > span:not(.vi-tier-after){opacity:.85}
.set-plan-foot + .settings-hint{overflow-wrap:normal}
.set-nb{white-space:nowrap}
#settings-modal .settings-opts button{min-height:32px}
@media(max-width:600px){
  #settings-modal{padding-top:calc(var(--vi-hdr-h,56px) + 8px)!important;padding-bottom:calc(var(--vi-tabbar-h,64px) + env(safe-area-inset-bottom,0px))!important}
  #settings-modal > div{padding:22px 16px!important}
  .settings-row{flex-direction:column;align-items:stretch;gap:6px}
  .settings-opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
  .settings-opts button{padding:8px 6px}
  #set-live .settings-row .set-btn{width:100%}
  .set-btns .set-btn,.set-plan-foot .set-btn{flex:1 1 140px}
}
.compact-nav .nav-tab-label{display:none}
.reduced-motion *{transition:none!important;animation:none!important}

/* ── Night / Daylight toggle ── */
html,body{overflow-x:clip}

/* ── Brand icons (sprite #vi-*) ── */
.vi-ic{--vi-sw:1.1;width:24px;height:24px;display:inline-block;flex:none;color:inherit;overflow:visible}
.vi-ic.sm{--vi-sw:1.5;width:18px;height:18px}
.vi-ic.g{--vi-sw:1.5;width:1.15em;height:1.15em;vertical-align:-.2em}
.vi-ic.flip{transform:rotate(90deg)}
.vi-ic.nx{transform:rotate(-90deg)}
.footer-version{display:none}
</style>
