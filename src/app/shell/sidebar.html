<div id="demo-chip" class="demo-chip" style="display:none"><span class="demo-chip-left">⚡ DEMO MODE &mdash; You&rsquo;re viewing sample data. <button onclick="clearDemoData()">Start with your own data</button></span><a class="demo-signup-btn" href="https://app.vault-it.co/" onclick="localStorage.removeItem('vi_demo_mode');localStorage.removeItem('vi_session');">Sign up &rarr;</a></div>
<div id="pwa-install-banner" style="display:none">
  <span>⬇ Install Vault-It: works offline, opens like an app</span>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="install-btn" onclick="triggerPwaInstall()">Install</button>
    <button class="dismiss-btn" onclick="dismissPwaBanner()"><svg class="vi-ic g" role="img" aria-label="Close"><use href="#vi-close"/></svg></button>
  </div>
</div>

<!-- TOP NAV -->
<!-- ── LEFT SIDEBAR ── -->
<div id="sidebar-toggle" onclick="toggleSidebar()" title="Open profile &amp; stats">
  <span id="sb-toggle-arrow" style="font-size:.85rem;font-weight:700;color:var(--em)"><svg class="vi-ic g nx" role="img" aria-label="Next"><use href="#vi-chevron"/></svg></span>
  <span style="font-family:'Syne',sans-serif;font-size:max(.28rem,var(--vi-fs-0));font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:var(--em);writing-mode:vertical-rl;text-orientation:mixed;opacity:.75;line-height:1">VAULT-IT</span>
</div>
<div id="left-sidebar">
  <div class="sb-section">
    <div class="sb-label">Net Worth</div>
    <div class="vi-currency-switcher" style="display:flex;gap:3px;margin-bottom:6px;flex-wrap:wrap">
      <button data-c="GBP" onclick="switchCurrency('GBP')" class="active" style="flex:1;font-family:'Share Tech Mono',monospace;font-size:max(.38rem,var(--vi-fs-1));padding:3px 4px;background:rgb(var(--teal-rgb) / .1);border:1px solid rgb(var(--teal-rgb) / .25);border-radius:4px;color:rgb(var(--teal-rgb) / .7);cursor:pointer;transition:all .15s" title="British Pound">£</button>
      <button data-c="USD" onclick="switchCurrency('USD')" style="flex:1;font-family:'Share Tech Mono',monospace;font-size:max(.38rem,var(--vi-fs-1));padding:3px 4px;background:rgb(var(--teal-rgb) / .06);border:1px solid rgb(var(--teal-rgb) / .12);border-radius:4px;color:rgb(var(--teal-rgb) / .4);cursor:pointer;transition:all .15s" title="US Dollar">$</button>
      <button data-c="EUR" onclick="switchCurrency('EUR')" style="flex:1;font-family:'Share Tech Mono',monospace;font-size:max(.38rem,var(--vi-fs-1));padding:3px 4px;background:rgb(var(--teal-rgb) / .06);border:1px solid rgb(var(--teal-rgb) / .12);border-radius:4px;color:rgb(var(--teal-rgb) / .4);cursor:pointer;transition:all .15s" title="Euro">€</button>
      <button data-c="INR" onclick="switchCurrency('INR')" style="flex:1;font-family:'Share Tech Mono',monospace;font-size:max(.38rem,var(--vi-fs-1));padding:3px 4px;background:rgb(var(--teal-rgb) / .06);border:1px solid rgb(var(--teal-rgb) / .12);border-radius:4px;color:rgb(var(--teal-rgb) / .4);cursor:pointer;transition:all .15s" title="Indian Rupee">₹</button>
    </div>
    <!-- the ledger (owner, 31 Oct): every money figure in the app, each with its icon, written by viRenderLedger from the dashboard's own functions -->
    <div id="sb-ledger" class="sb-ledger"></div>
  </div>
  <div class="sb-section" id="sb-profile-section">
    <div class="sb-label">Your Profile</div>
    <!-- XP CTA — hidden once profile complete -->
    <div id="sb-profile-cta" style="background:linear-gradient(135deg,rgb(var(--brass-rgb) / .14),rgb(var(--brass-rgb) / .06));border:1px solid rgb(var(--brass-rgb) / .32);border-radius:7px;padding:8px 10px;margin-bottom:9px;text-align:center">
      <div style="font-family:'Syne',sans-serif;font-size:max(.52rem,var(--vi-fs-1));font-weight:800;color:var(--go);letter-spacing:.12em;margin-bottom:2px">🎖 +100 XP AVAILABLE</div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:max(.4rem,var(--vi-fs-1));color:var(--t2);line-height:1.45">Complete your profile to unlock your Pioneer card &amp; earn your founding badge</div>
    </div>
    <!-- Profile fields — hidden when profile complete, shown in edit mode -->
    <div id="sb-profile-fields">
      <!-- Avatar -->
      <div style="text-align:center;margin-bottom:8px">
        <div id="sb-avatar" style="width:52px;height:52px;border-radius:50%;background:rgb(var(--teal-rgb) / .15);border:2px solid rgb(var(--teal-rgb) / .3);margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;overflow:hidden" onclick="document.getElementById('sb-avatar-upload').click()" title="Tap to upload photo">👤</div>
        <input type="file" id="sb-avatar-upload" accept="image/*" style="display:none" onchange="uploadSbAvatar(this)">
        <div style="font-family:'Share Tech Mono',monospace;font-size:max(.38rem,var(--vi-fs-1));color:var(--t3);letter-spacing:.08em">TAP TO UPLOAD</div>
      </div>
      <!-- Basic info -->
      <div style="margin-bottom:5px">
        <label class="sb-field-lbl">Name</label>
        <input type="text" id="sb-profile-name" class="al-inp" placeholder="Your name" style="font-size:max(.56rem,var(--vi-fs-2));padding:4px 7px;width:100%" onchange="saveProfile()">
      </div>
      <div style="margin-bottom:5px">
        <label class="sb-field-lbl">Email</label>
        <input type="email" id="sb-profile-email" class="al-inp" placeholder="you@example.com" style="font-size:max(.56rem,var(--vi-fs-2));padding:4px 7px;width:100%" onchange="saveProfile()">
      </div>
      <div style="margin-bottom:5px">
        <label class="sb-field-lbl">Profession</label>
        <input type="text" id="sb-profile-job" class="al-inp" placeholder="What do you do?" style="font-size:max(.56rem,var(--vi-fs-2));padding:4px 7px;width:100%" onchange="saveProfile()">
      </div>
      <div style="margin-bottom:8px">
        <label class="sb-field-lbl">Dream Profession</label>
        <input type="text" id="sb-profile-dream" class="al-inp" placeholder="When Vault-It works..." style="font-size:max(.56rem,var(--vi-fs-2));padding:4px 7px;width:100%" onchange="saveProfile()">
      </div>
      <!-- Archetypes -->
      <div style="margin-bottom:5px">
        <label class="sb-field-lbl">Saving Archetype</label>
        <select id="sb-save-arch" class="sb-select" onchange="saveProfile()">
          <option value="">Choose yours</option>
          <option value="🐿️ The Squirrel">🐿️ The Squirrel: steady, habitual saver</option>
          <option value="🎯 The Sniper">🎯 The Sniper: goal-first, saves with a target</option>
          <option value="📈 The Investor">📈 The Investor: deploys savings, money works</option>
          <option value="🌊 The Tidal Saver">🌊 The Tidal Saver: saves hard when income spikes</option>
        </select>
      </div>
      <div style="margin-bottom:10px">
        <label class="sb-field-lbl">Spending Archetype</label>
        <select id="sb-spend-arch" class="sb-select" onchange="saveProfile()">
          <option value="">Choose yours</option>
          <option value="🧘 The Minimalist">🧘 The Minimalist: only spends on what matters</option>
          <option value="🎭 Experience Seeker">🎭 Experience Seeker: memories, not things</option>
          <option value="🛒 Comfort Spender">🛒 Comfort Spender: quality of life first</option>
          <option value="⚡ Impulse Reactor">⚡ Impulse Reactor: spends freely, patches later</option>
        </select>
      </div>
    </div>
    <!-- Pioneer card — with pencil edit button -->
    <div style="position:relative">
      <button id="sb-edit-btn" onclick="toggleProfileEdit()" title="Edit profile" style="display:none;position:absolute;top:-2px;right:0;z-index:10;background:rgb(var(--teal-rgb) / .12);border:1px solid rgb(var(--teal-rgb) / .28);border-radius:5px;color:var(--em);font-size:max(.58rem,var(--vi-fs-2));padding:3px 7px;cursor:pointer;line-height:1;transition:background .18s" onmouseover="this.style.background='rgb(var(--teal-rgb) / .25)'" onmouseout="this.style.background='rgb(var(--teal-rgb) / .12)'">✏</button>
      <div id="sb-pioneer-card"></div>
    </div>
  </div>
  <div style="margin-top:auto;padding-top:12px;border-top:1px solid rgb(var(--teal-rgb) / .08)">
    <button onclick="showSettings()" title="Settings" style="width:100%;background:rgb(var(--panel-rgb) / 0.92);border:1px solid rgb(var(--teal-rgb) / 0.25);border-radius:6px;padding:8px 11px;color:rgba(90,96,104,0.9);font-size:max(.62rem,var(--vi-fs-2));cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.08em" onmouseover="this.style.borderColor='rgb(var(--teal-rgb) / 0.6)';this.style.color='rgba(232,232,232,0.9)'" onmouseout="this.style.borderColor='rgb(var(--teal-rgb) / 0.25)';this.style.color='rgba(90,96,104,0.9)'">Settings</button>
  </div>
</div>
