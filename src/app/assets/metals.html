    <div class="subtab-panel" id="assets-metals">
      <div style="display:flex;justify-content:flex-end;margin:10px 0 2px">
        <span style="font-family:'Share Tech Mono',monospace;font-size:max(.68rem,var(--vi-fs-2));color:var(--gold)">Metals: <span id="subtab-total-metals" style="font-weight:700">£0</span></span>
      </div>
      <div style="margin-top:4px">
        <div class="scene-card" id="metalsSceneCard">

          <div class="scene" id="metals-scene">
            <svg id="metalsSvg" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"></svg>
            <!-- Left-edge collapsible guide -->
            <div class="vp-guide" id="vp-guide-metals">
              <div class="vp-guide-tab" onclick="toggleVpGuide('metals')" title="Controls guide">
                <svg width="10" height="9" viewBox="0 0 10 9" fill="none"><line x1="1" y1="1.5" x2="9" y2="1.5" stroke="#44c0b9" stroke-width="1.3" stroke-linecap="round"/><line x1="1" y1="4.5" x2="9" y2="4.5" stroke="#44c0b9" stroke-width="1.3" stroke-linecap="round"/><line x1="1" y1="7.5" x2="9" y2="7.5" stroke="#44c0b9" stroke-width="1.3" stroke-linecap="round"/></svg>
              </div>
              <div class="vp-guide-panel">
                <div class="vp-gi">
                  <div class="vp-gi-hd">CONTROLS</div>
                  <div class="vp-gi-row">
                    <div class="vp-gi-ico"><svg width="16" height="20" viewBox="0 0 16 20" fill="none"><path d="M8 10 L8 3 Q8 1.5 9.2 1.5 Q10.5 1.5 10.5 3 L10.5 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M5.5 10 L5.5 5 Q5.5 3.8 6.8 3.8 Q8 3.8 8 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.5 8 L10.5 6 Q10.5 4.8 11.8 4.8 Q13 4.8 13 6 L13 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13 10 L13 8 Q13 7 14 7 Q15 7 15 8 L15 12 Q15 17 8 18 Q1 18 1 12 L1 10 Q1 8.5 3.2 8.5 Q5.5 8.5 5.5 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 0 L7 1.5 M8 0 L9 1.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></div>
                    <div class="vp-gi-lbl"><b>DRAG</b>pan view</div>
                  </div>
                  <div class="vp-gi-sep"></div>
                  <div class="vp-gi-row">
                    <div class="vp-gi-ico"><svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M5 10 L5 3 Q5 1.5 6.5 1.5 Q8 1.5 8 3 L8 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10 10 L10 3 Q10 1.5 11.5 1.5 Q13 1.5 13 3 L13 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3 10 Q3 8.5 5 8.5 L8 8.5 L10 8.5 L13 8.5 Q15 8.5 15 10 L15 13 Q15 17.5 9 18 Q3 18 3 13 Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0.5 7 Q-0.5 10 1 13" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M0.5 7 L1.5 8 M0.5 7 L1.8 7.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></div>
                    <div class="vp-gi-lbl"><b>2 FINGERS</b>orbit angle</div>
                  </div>
                  <div class="vp-gi-sep"></div>
                  <div class="vp-gi-row">
                    <div class="vp-gi-ico"><svg width="18" height="16" viewBox="0 0 18 16" fill="none"><path d="M3 12 L3 4 Q3 2 5 2 Q7 2 7 4 L7 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M15 12 L15 4 Q15 2 13 2 Q11 2 11 4 L11 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8.2 9 L5.5 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M6.5 8 L5.5 9 L6.5 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.8 9 L12.5 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M11.5 8 L12.5 9 L11.5 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div class="vp-gi-lbl"><b>PINCH</b>zoom in/out</div>
                  </div>
                  <div class="vp-gi-sep"></div>
                  <div class="vp-gi-row">
                    <div class="vp-gi-ico"><svg width="12" height="17" viewBox="0 0 12 17" fill="none"><rect x="1" y="1" width="10" height="15" rx="5" stroke="currentColor" stroke-width="1.3"/><line x1="6" y1="4" x2="6" y2="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4.5 3 L6 1.5 L7.5 3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 8.5 L6 10 L7.5 8.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <div class="vp-gi-lbl"><b>SCROLL</b>zoom in/out</div>
                  </div>
                  <div class="vp-gi-sep"></div>
                  <div class="vp-gi-row">
                    <div class="vp-gi-ico" style="font-size:.9rem;color:rgb(var(--teal-rgb) / .72)">✥</div>
                    <div class="vp-gi-lbl"><b>✥ BUTTON</b>orbit mode</div>
                  </div>
                </div>
              </div>
            </div>
            <!-- HUD inside scene — positions correctly relative to viewport -->
            <div class="hud-bar" id="hud-bar-metals">
              <button class="hud-btn" onclick="metalsZoomIn()"  title="Zoom In"  aria-label="Zoom in"  style="font-size:1.1rem;font-weight:700;padding:0">+</button>
              <button class="hud-btn" onclick="metalsZoomOut()" title="Zoom Out" aria-label="Zoom out" style="font-size:1.2rem;font-weight:700;padding:0">−</button>
              <div class="hud-sep"></div>
              <button class="hud-btn hud-toggle" id="hud-metals-orbit-toggle" onclick="toggleMetalsOrbitMode()" title="Toggle orbit mode" aria-label="Toggle orbit mode">
                <span id="hud-metals-orbit-icon">✥</span>
              </button>
              <div class="hud-sep"></div>
              <button class="hud-btn" onclick="resetMetalsView()" title="Reset view" aria-label="Reset camera">↺</button>
              <button class="hud-btn" id="btnMetalsExpand" onclick="toggleMetalsExpand()" title="Fullscreen" aria-label="Fullscreen">⛶</button>
            </div>
          </div>
          <div class="vp-key">☝ DRAG TO PAN &nbsp;·&nbsp; ✌ DRAG TO ORBIT &nbsp;·&nbsp; ⊕ SCROLL / PINCH TO ZOOM</div>
          <div class="scene-cap" id="metalsCap">–</div>
        </div>
        <div class="ov-data-card mh-card" style="margin-top:12px">
          <div class="ov-data-title" style="color:var(--gold)">Your metals and today's prices</div>
          <div class="mh-head" aria-hidden="true"><span>Metal</span><span>You hold (troy oz)</span><span>Price per oz</span><span>Add</span><span>Value</span></div>
          <div id="metals-inputs"></div>
          <button class="btn-add-data" style="width:100%;margin-top:8px" onclick="fetchMetalPrices()">↻ Fetch live prices</button>
        </div>
        <div id="metals-kpis" class="g4" style="margin-top:12px"></div>
      </div>
    </div>
