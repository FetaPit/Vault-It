<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Vault·It · leaving the demo</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;color:#9aa0a6;font:15px/1.5 'DM Sans',system-ui,sans-serif;text-align:center;padding:24px}
b{display:block;color:#44c0b9;font-size:1.05rem;margin-bottom:8px}
</style>
</head>
<body>
<div><b>Leaving the demo…</b><span id="msg">Putting this device's own data back.</span></div>
<script>
(function () {
  var APP = 'https://app.vault-it.co/';
  var BACKUP = 'vi_demo_backup';
  try {
    var raw = localStorage.getItem(BACKUP);
    var u = null; try { u = JSON.parse(localStorage.getItem('vi_user') || 'null'); } catch (e) {}
    var inDemo = !!(u && u.email === 'demo@vault-it.app');
    if (inDemo) {
      localStorage.clear();
      if (raw) { var b = JSON.parse(raw); Object.keys(b.data || {}).forEach(function (k) { localStorage.setItem(k, b.data[k]); }); }
    } else {
      localStorage.removeItem(BACKUP);   // a real account has taken over this device since the demo: leave it alone
    }
  } catch (e) {}
  location.replace(APP);
})();
</script>
</body>
</html>
