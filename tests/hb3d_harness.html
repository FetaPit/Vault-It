</head><body><div id="v"></div><script>
var V=null,M=null;
window.show=function(type,p,mode,opts){opts=opts||{};if(!V)V=new HB3D.Viewer(document.getElementById('v'),{preserve:true,mobile:!!opts.mobile});
  var t0=performance.now();M=HB3D.build(type,opts);var t1=performance.now();V.show(M);V.setState({p:p,mode:mode||'complete',eq:opts.eq||0,lights:p>=1&&mode!=='build'});

  if(opts.zoom)V.setZoom(opts.zoom);V.controls.update();V.render();var t2=performance.now();
  return{build:Math.round(t1-t0),render:Math.round(t2-t1),inst:M.instances,counts:M.counts,height:+M.height.toFixed(2),bounds:M.bounds,stats:M.stats(p),info:M.renderer=undefined, calls:V.renderer.info.render.calls,tris:V.renderer.info.render.triangles};};
