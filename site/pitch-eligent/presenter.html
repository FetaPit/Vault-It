<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Vault-It · Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Share+Tech+Mono&family=Syne:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;background:#04090f;color:#E8E8E8;font-family:'DM Sans',Arial,sans-serif;overflow-x:hidden}
main{max-width:1280px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;border:1px solid #15302F}
.frame>section{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(var(--s,.5));overflow:hidden}
section h1,section h2,section h3,section p,section ul{margin:0}
section h1{line-height:1.1}section h2{line-height:1.15}section h3{line-height:1.2}section p{line-height:1.4}
section ul{padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:.3em}
section img,section video{display:block}
.frame>section>*:not([style*="position:absolute"]){position:relative}
header{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(4,9,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid #15302F}
header b{font:600 18px 'Syne',Arial,sans-serif;color:#E8E8E8}
.pv-btn{min-width:44px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #C9A84C;background:#12100A;color:#E8C56A;font:16px 'Share Tech Mono',monospace;cursor:pointer;letter-spacing:1px}
.pv-btn:focus-visible{outline:2px solid #44C0B9;outline-offset:2px}
#pv-bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;gap:8px;align-items:center;padding:6px;border-radius:999px;background:rgba(8,13,20,.82);border:1px solid #15302F;opacity:.6;transition:opacity .2s}
#pv-bar:hover,#pv-bar:focus-within{opacity:1}
#pv-count{font:16px 'Share Tech Mono',monospace;color:#B6D8D6;min-width:72px;text-align:center}
#pv-bar .pv-btn{padding:0 14px;border-color:#15302F;background:#0A1018;color:#E8E8E8}
body.present{background:#000;overflow:hidden}
body.present header,body.present footer{display:none}
body.present main{max-width:none;padding:0}
body.present .frame{display:none}
body.present .frame.on{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:auto;border:0;border-radius:0}
body.present #pv-bar{display:flex}
@media (prefers-reduced-motion:reduce){#pv-bar{transition:none}}
.live{position:absolute;z-index:2;overflow:hidden;border-radius:calc(18px*var(--s));border:1px solid #15302F;opacity:0;pointer-events:none}
.live.on{opacity:1;pointer-events:auto;background-color:#080808;background-image:radial-gradient(120% 90% at 50% 100%,#06242A 0%,#00131A 45%,#080808 100%)}
.live canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y;outline-offset:-3px}
.live canvas:focus-visible{outline:2px solid #44C0B9}
.live-badge{position:absolute;left:calc(20px*var(--s));top:calc(18px*var(--s));font:max(10px,calc(20px*var(--s))) 'Share Tech Mono',monospace;letter-spacing:.1em;color:#E8C56A;background:rgba(8,8,8,.7);border:1px solid #C9A84C;border-radius:999px;padding:.25em .8em;pointer-events:none}
.live-read{position:absolute;left:calc(20px*var(--s));right:calc(110px*var(--s));bottom:calc(16px*var(--s));margin:0;font:max(10px,calc(22px*var(--s))) 'Share Tech Mono',monospace;line-height:1.35;color:#B6D8D6;text-shadow:0 0 6px #000;pointer-events:none}
.live-z{position:absolute;right:calc(14px*var(--s));bottom:calc(14px*var(--s));display:flex;flex-direction:column;gap:calc(8px*var(--s))}
.live-z button{width:max(28px,calc(56px*var(--s)));height:max(28px,calc(56px*var(--s)));border-radius:calc(12px*var(--s));border:1px solid #15302F;background:rgba(8,13,20,.85);color:#E8E8E8;font:max(14px,calc(26px*var(--s))) 'DM Sans',Arial,sans-serif;cursor:pointer;padding:0}
.live-z button:focus-visible{outline:2px solid #44C0B9}
.live[data-live="trk"] .live-badge{left:auto;right:calc(20px*var(--s))}
footer{text-align:center;font:14px 'Share Tech Mono',monospace;color:#7FA9A6;padding:8px 16px 32px}
footer a{color:#E8C56A}
/* Vault-It tagline neon (owner, 4 Nov 2026): thin neon red stroke on "red", thin gold gradient neon stroke on "home". */
.vi-neon{position:relative;display:inline-block;isolation:isolate}
.vi-neon::before,.vi-neon::after{content:attr(data-t);position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;color:transparent}
.vi-neon::before{z-index:-1;-webkit-text-stroke:var(--neon-w,.065em) transparent;-webkit-background-clip:text;background-clip:text}
.vi-neon::after{z-index:-2;-webkit-text-stroke:var(--neon-w,.065em) var(--neon-glow);filter:blur(.07em);opacity:.85}
.vi-neon-red{--neon-glow:#FF2E4D}
.vi-neon-red::before{background-image:linear-gradient(#FF4D63,#FF4D63)}
.vi-neon-gold{--neon-glow:#F2C94C}
.vi-neon-gold::before{background-image:linear-gradient(100deg,#B8862E 0%,#F5DC4A 38%,#FFF1B0 52%,#E8C56A 68%,#B8862E 100%)}

body.pres{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;overflow:hidden}
.pr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #15302F;background:#04090f}
.pr-top b{font:600 16px 'Syne',Arial,sans-serif}
#pr-clock{font:28px 'Share Tech Mono',monospace;color:#E8E8E8;min-width:90px}
#pr-clock.late{color:#E8C56A}#pr-clock.over{color:#E05C5C}
#pr-check,#pr-link{font:14px 'Share Tech Mono',monospace;color:#7FA9A6}
#pr-link.on{color:#3ECF8E}
.pr-sp{flex:1}
.pr-main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:16px;min-height:0;overflow:auto}
.pr-mir{display:flex;flex-direction:column;gap:10px;min-width:0}
.pr-lab{font:13px 'Share Tech Mono',monospace;letter-spacing:.12em;color:#7FA9A6}
.pr-next{width:55%}
.pr-right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;min-height:0;min-width:0}
.pr-sc{min-height:0;overflow:auto;background:#080D14;border:1px solid #15302F;border-radius:14px;padding:16px 20px}
.pr-sc p{margin:8px 0 0;font:20px/1.5 'DM Sans',Arial,sans-serif;color:#E8E8E8}
.pr-sc p.do{font-style:italic;color:#E8C56A}
.pr-side{display:flex;flex-direction:column;gap:10px;min-width:0;background:#080D14;border:1px solid #15302F;border-radius:14px;padding:20px}
#pr-n{font:14px 'Share Tech Mono',monospace;color:#44C0B9;letter-spacing:.1em}
#pr-beat{font:700 30px/1.15 'Syne',Arial,sans-serif;color:#E8E8E8;margin:0}
#pr-win{font:15px 'Share Tech Mono',monospace;color:#E8C56A}
#pr-cues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
#pr-cues li{display:flex;gap:12px;align-items:flex-start;font:22px/1.35 'DM Sans',Arial,sans-serif;color:#E8E8E8}
#pr-cues li.do{color:#E8C56A}
#pr-cues svg{flex:none;width:26px;height:26px;color:#44C0B9;opacity:.8;margin-top:2px;--vi-sw:1.3}
#pr-cues li.do svg{color:#E8C56A}
#pr-upnext{font:15px 'DM Sans',Arial,sans-serif;color:#7FA9A6;border-top:1px solid #15302F;padding-top:10px}
.pr-bot{display:flex;gap:10px;justify-content:center;padding:10px 16px;border-top:1px solid #15302F;background:#04090f}
.pr-bot .pv-btn{min-width:120px}
.pr-cr{margin:0;padding:6px 16px 10px;text-align:center;font:12px 'Share Tech Mono',monospace;color:#7FA9A6;background:#04090f}
@media (max-width:820px){.pr-main{grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start}.pr-right{order:-1;grid-template-rows:auto auto}.pr-sc{overflow:visible}.pr-next{display:none}#pr-beat{font-size:24px}#pr-cues li{font-size:19px}}
</style></head><body class="pres">
