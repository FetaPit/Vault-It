<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Vault-It · Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Share+Tech+Mono&family=Syne:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;background:#04090f;color:#E8E8E8;font-family:'DM Sans',Arial,sans-serif;overflow-x:hidden}
main{max-width:1280px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;border:1px solid #15302F}
.frame>section{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(var(--s,.5));overflow:hidden}
section h1,section h2,section h3,section p,section ul{margin:0}
section h1{line-height:1.1}section h2{line-height:1.15}section h3{line-height:1.2}section p{line-height:1.4}
section ul{padding:0 0 0 1.1em;display:flex;flex-direction:column;gap:.3em}
section img,section video{display:block}
.frame>section>*:not([style*="position:absolute"]){position:relative}
header{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(4,9,15,.88);backdrop-filter:blur(8px);border-bottom:1px solid #15302F}
header b{font:600 18px 'Syne',Arial,sans-serif;color:#E8E8E8}
.pv-btn{min-width:44px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #C9A84C;background:#12100A;color:#E8C56A;font:16px 'Share Tech Mono',monospace;cursor:pointer;letter-spacing:1px}
.pv-btn:focus-visible{outline:2px solid #44C0B9;outline-offset:2px}
#pv-bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;gap:8px;align-items:center;padding:6px;border-radius:999px;background:rgba(8,13,20,.82);border:1px solid #15302F;opacity:.6;transition:opacity .2s}
#pv-bar:hover,#pv-bar:focus-within{opacity:1}
#pv-count{font:16px 'Share Tech Mono',monospace;color:#B6D8D6;min-width:72px;text-align:center}
#pv-bar .pv-btn{padding:0 14px;border-color:#15302F;background:#0A1018;color:#E8E8E8}
body.present{background:#000;overflow:hidden}
body.present header,body.present footer{display:none}
body.present main{max-width:none;padding:0}
body.present .frame{display:none}
body.present .frame.on{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:auto;border:0;border-radius:0}
body.present #pv-bar{display:flex}
@media (prefers-reduced-motion:reduce){#pv-bar{transition:none}}
.live{position:absolute;z-index:2;overflow:hidden;border-radius:calc(18px*var(--s));border:1px solid #15302F;opacity:0;pointer-events:none}
.live.on{opacity:1;pointer-events:auto;background-color:#080808;background-image:radial-gradient(120% 90% at 50% 100%,#06242A 0%,#00131A 45%,#080808 100%)}
.live canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y;outline-offset:-3px}
.live canvas:focus-visible{outline:2px solid #44C0B9}
.live-badge{position:absolute;left:calc(20px*var(--s));top:calc(18px*var(--s));font:max(10px,calc(20px*var(--s))) 'Share Tech Mono',monospace;letter-spacing:.1em;color:#E8C56A;background:rgba(8,8,8,.7);border:1px solid #C9A84C;border-radius:999px;padding:.25em .8em;pointer-events:none}
.live-read{position:absolute;left:calc(20px*var(--s));right:calc(110px*var(--s));bottom:calc(16px*var(--s));margin:0;font:max(10px,calc(22px*var(--s))) 'Share Tech Mono',monospace;line-height:1.35;color:#B6D8D6;text-shadow:0 0 6px #000;pointer-events:none}
.live-z{position:absolute;right:calc(14px*var(--s));bottom:calc(14px*var(--s));display:flex;flex-direction:column;gap:calc(8px*var(--s))}
.live-z button{width:max(28px,calc(56px*var(--s)));height:max(28px,calc(56px*var(--s)));border-radius:calc(12px*var(--s));border:1px solid #15302F;background:rgba(8,13,20,.85);color:#E8E8E8;font:max(14px,calc(26px*var(--s))) 'DM Sans',Arial,sans-serif;cursor:pointer;padding:0}
.live-z button:focus-visible{outline:2px solid #44C0B9}
.live[data-live="trk"] .live-badge{left:auto;right:calc(20px*var(--s))}
footer{text-align:center;font:14px 'Share Tech Mono',monospace;color:#7FA9A6;padding:8px 16px 32px}
footer a{color:#E8C56A}

body.pres{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;overflow:hidden}
.pr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #15302F;background:#04090f}
.pr-top b{font:600 16px 'Syne',Arial,sans-serif}
#pr-clock{font:28px 'Share Tech Mono',monospace;color:#E8E8E8;min-width:90px}
#pr-clock.late{color:#E8C56A}#pr-clock.over{color:#E05C5C}
#pr-check,#pr-link{font:14px 'Share Tech Mono',monospace;color:#7FA9A6}
#pr-link.on{color:#3ECF8E}
.pr-sp{flex:1}
.pr-main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:16px;min-height:0;overflow:auto}
.pr-mir{display:flex;flex-direction:column;gap:10px;min-width:0}
.pr-lab{font:13px 'Share Tech Mono',monospace;letter-spacing:.12em;color:#7FA9A6}
.pr-next{width:55%}
.pr-right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;min-height:0;min-width:0}
.pr-sc{min-height:0;overflow:auto;background:#080D14;border:1px solid #15302F;border-radius:14px;padding:16px 20px}
.pr-sc p{margin:8px 0 0;font:20px/1.5 'DM Sans',Arial,sans-serif;color:#E8E8E8}
.pr-sc p.do{font-style:italic;color:#E8C56A}
.pr-side{display:flex;flex-direction:column;gap:10px;min-width:0;background:#080D14;border:1px solid #15302F;border-radius:14px;padding:20px}
#pr-n{font:14px 'Share Tech Mono',monospace;color:#44C0B9;letter-spacing:.1em}
#pr-beat{font:700 30px/1.15 'Syne',Arial,sans-serif;color:#E8E8E8;margin:0}
#pr-win{font:15px 'Share Tech Mono',monospace;color:#E8C56A}
#pr-cues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
#pr-cues li{display:flex;gap:12px;align-items:flex-start;font:22px/1.35 'DM Sans',Arial,sans-serif;color:#E8E8E8}
#pr-cues li.do{color:#E8C56A}
#pr-cues svg{flex:none;width:26px;height:26px;color:#44C0B9;opacity:.8;margin-top:2px;--vi-sw:1.3}
#pr-cues li.do svg{color:#E8C56A}
#pr-upnext{font:15px 'DM Sans',Arial,sans-serif;color:#7FA9A6;border-top:1px solid #15302F;padding-top:10px}
.pr-bot{display:flex;gap:10px;justify-content:center;padding:10px 16px;border-top:1px solid #15302F;background:#04090f}
.pr-bot .pv-btn{min-width:120px}
.pr-cr{margin:0;padding:6px 16px 10px;text-align:center;font:12px 'Share Tech Mono',monospace;color:#7FA9A6;background:#04090f}
@media (max-width:820px){.pr-main{grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start}.pr-right{order:-1;grid-template-rows:auto auto}.pr-sc{overflow:visible}.pr-next{display:none}#pr-beat{font-size:24px}#pr-cues li{font-size:19px}}
</style></head><body class="pres">

<p style="font-size:26px;line-height:1.4;color:#B6D8D6">of people are estimated to be neurodivergent. Time-blindness and executive-function load make a ten-year goal feel unreal.</p>

<div style="flex:1;display:flex;flex-direction:column;gap:16px;background:#0A1018;border:1px solid #15302F;border-top:4px solid #44C0B9;border-radius:18px;padding:36px">
<h3 style="font-family:'Syne', Arial, sans-serif;font-size:36px;font-weight:700;color:#E8E8E8">What Vault-It does</h3>
<p style="font-size:26px;line-height:1.4;color:#B6D8D6">Turns the goal into a place: one date, a house you can orbit, and a visible response to every action. The next step is one brick, not a ten-year plan.</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:16px;background:#0A1018;border:1px solid #15302F;border-top:4px solid #E8C56A;border-radius:18px;padding:36px">
<h3 style="font-family:'Syne', Arial, sans-serif;font-size:36px;font-weight:700;color:#E8E8E8">The evidence</h3>
<ul style="font-size:24px;line-height:1.4;color:#B6D8D6">
<li>AR improved personal-finance problem solving for autistic students (Root et al., 2022)</li>
<li>Meta-analysis of 33 studies: large gains from AR and VR in autism (Karami et al., 2021)</li>

 answers the one question they're asking: when will I own a home?"},{"id":"gap","at":70,"atl":"1:10","dur":15,"beat":"The gap","b":[["budget","Budgeting apps optimise today"],["piggy","First-time buyer apps assume savings"],["target","Nobody starts below zero with a date · move fast"]],"sc":"Budgeting apps optimise today. First-time buyer apps assume you already have savings. Nobody starts you below zero and gives you a date. It's a narrow gap and it can be copied, so we're moving fast on brand and partners."},{"id":"solution","at":85,"atl":"1:25","dur":25,"beat":"One live date","b":[["debt-total","Stage 0 is a starting line"],["calendar","Keys date recalculates with every payment"],["brick-wall","Every pound lays bricks · 14,465 of them"]],"sc":"One live date, and a home built brick by brick. Stage zero is a starting line, not a failure screen. Your keys date recalculates every time you pay something off or save. Every pound lays real bricks: 14,465 of them in a Victorian terrace. That's our own 3D engine."},{"id":"features","at":110,"atl":"1:50","dur":20,"beat":"Live demo: Net worth in 3D","b":[["orbit","DO: drag slowly to turn it"],["mouse","DO: click one column"],["net-worth","Own on the gold line, owe below · see it, don’t read it"]],"sc":"*Do: drag slowly to turn it, then click one column.*\nThis is the app, live. What you own stands on the gold line, what you owe hangs below. Tap a column and it reads it out. Pay a debt and its blocks lift away. People don't read their money here, they see it."},{"id":"evidence","at":130,"atl":"2:10","dur":15,"beat":"The behaviour science","b":[["user","Future self shown → people save more"],["trend-base","People speed up as the goal gets closer"],["forecast","Solid = done · see-through = next six months"]],"sc":"The behaviour science backs it. People shown their future self save more. People speed up as a goal gets closer. Solid blocks are months done; see-through blocks are the next six. The future, made visible."},{"id":"whynow","at":145,"atl":"2:25","dur":15,"beat":"Why now","b":[["bank","Budget: First Time Buyer ISA replaces the LISA"],["search","90,500 searches a month · everyone’s confused"],["rocket","We’re shipping a free planner"]],"sc":"Last week's Budget announced a First Time Buyer ISA to replace the Lifetime ISA. 90,500 people a month already search \"Lifetime ISA\". Everyone's confused, and we're shipping a free planner that answers it."},{"id":"model","at":160,"atl":"2:40","dur":20,"beat":"Pricing","b":[["check","30-day free trial of Pioneer · card now, first charge day 31"],["coins","Pioneer £5.99 a month or £59.99 a year · Founding £149, 100 places"],["crown","Testers: £3.99 · £49.99 · £99 for a limited time"]],"sc":"Every plan starts with a 30-day free trial of Pioneer. Your card is taken at sign-up and first charged on day 31, and you can cancel before and pay nothing. Pioneer is £5.99 a month or £59.99 a year, with family mode coming. Founding is £149 once, capped at 100 places. And our alpha testers get a limited-time discount: £3.99 a month, £49.99 a year, or £99 for Founding."},{"id":"partner","at":180,"atl":"3:00","dur":25,"beat":"B2B: priced offers","b":[["bank","Pilot £2.5k to £5k · Partner Edition £10k to £25k + £1 to £3 a user"],["lifebuoy","Impact licence: grant-funded, funding split proposed · brands sponsor Pioneer"],["check","No bank data · trust costs paid by set-up fees"]],"sc":"The bigger engine is B2B. A 90-day paid pilot at £2,500 to £5,000. A white-label Partner Edition at £10k to £25k set-up, then £1 to £3 per active user a month. An Impact licence for debt charities is grant-funded, a split we are proposing: more on the next slide. No bank data and no integration keeps a pilot low-risk. Running cost is about 2p a user; the real cost is trust, a pen test and certification, which set-up fees pay for."},{"id":"impact","dur":25,"beat":"Impact licence: bridge and window","b":[["network","Bridge: people in debt to their charity"],["info","Window: assets, income, debt, net worth in one place"],["coins","Yearly plan: 50% grants · 25% charity · 25% Vault-It"]],"sc":"For debt charities there's an Impact licence. Vault-It is the bridge and the window. The person in debt sees their assets, income, debts and net worth in one place. With their permission, the charity sees it too, so it can advise on strategies to stop debt escalating and spot ways to reallocate. A yearly plan is funded half by public debt grants, a quarter by the charity, and a quarter by Vault-It as a subsidy.","at":205,"atl":"3:25"},{"id":"gtm","at":230,"atl":"3:50","dur":25,"beat":"Route to market","b":[["keys","Free date, then a 30-day trial, then Pioneer"],["camera","Brick videos · creators · town pages · LinkedIn"],["mail","10 letters of intent asked · first pilot £2,500"]],"sc":"One hook, two funnels. Consumers get a free keys date, then a 30-day trial of Pioneer. Brick-laying videos, creators and town pages bring them in: picture the video that ends at a real front door. Institutions come through founder-led outreach, with letters of intent asked of ten building societies, brokers and charities. Targets: 3,000 on the waitlist, 4% to paid, 30% active in week 4."},{"id":"traction","at":255,"atl":"4:15","dur":10,"beat":"Where we are","b":[["check","Live alpha · Web Summit · self-funded"],["milestone","Next 6 weeks: Ltd submitted, ISA planner, pre-sale, first LOI"]],"sc":"Live alpha, Web Summit startup programme, self-funded. Next six weeks: Vault-It Ltd's incorporation went in on 6 November and the certificate is due by the 10th; then we assign the IP and apply for SEIS advance assurance, ship the ISA planner, open the pre-sale, sign the first letter of intent."},{"id":"forecast","at":265,"atl":"4:25","dur":30,"beat":"Forecast: five income lines","b":[["trend-base","Revenue £66,900 · £282,990 · £720,975"],["coin","Cumulative profit passes £250k in October 2028"],["info","Illustrative · partner delivery costs not yet modelled"]],"sc":"Each income stream has its own line: consumer plans, five paid pilots, partner licences growing from two to twenty, and financial institutions sponsoring Pioneer licences. Revenue is about £67,000 in year one, £283,000 in year two and £721,000 in year three. On these illustrative figures, cumulative profit passes £250,000 in October 2028. Partner delivery costs aren't modelled yet."},{"id":"ask","at":295,"atl":"4:55","dur":30,"beat":"The ask","b":[["coin","£250,000 SEIS · closing March 2027 · terms on request"],["budget","35 R&D · 20 marketing · 15 partners · 15 security · 15 contingency"],["milestone","Pilot · 30% retention · 1,000 payers · Partner Edition"],["keys","“What’s your keys date?” · Thank you · pause"]],"sc":"So, the ask: £250,000 under SEIS, closing March 2027, equity terms on request. 35% goes to R&D and product, including a technical cofounder; 20% to marketing; 15% each to partnerships, security and contingency. That buys about 18 months, to a paid pilot, 30% week-4 retention, 1,000 paying users and a first Partner Edition. And from this room: introductions to building societies, brokers and debt charities. So, what's your keys date? Thank you."},{"id":"close","at":325,"atl":"5:25","dur":0,"beat":"Questions","b":[["chat","Leave this up for Q&A"],["mail","pete@ptlive.design"]],"sc":"Leave this up for questions."}];
var T=document.getElementById('pr-slides').content.querySelectorAll('section'),N=C.length,cur=0,t0=null,linked=0;
var $=function(id){return document.getElementById(id)};
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function fit(){['pr-cur','pr-nxt'].forEach(function(id){var f=$(id);f.style.setProperty('--s',f.clientWidth/1920)})}
function put(id,k){var f=$(id);f.innerHTML='';if(k<N)f.appendChild(T[k].cloneNode(true));f.style.visibility=k<N?'visible':'hidden'}
function ic(n){return '<svg aria-hidden="true"><use href="#vi-'+n+'"/></svg>'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){var c=C[cur];put('pr-cur',cur);put('pr-nxt',cur+1);fit();
 $('pr-n').textContent='SLIDE '+(cur+1)+' / '+N;$('pr-beat').textContent=c.beat;
 $('pr-win').textContent=c.dur?('Start '+c.atl+' · about '+c.dur+' s'):'After 5:00';
 $('pr-cues').innerHTML=c.b.map(function(x){return '<li'+(/^DO:/.test(x[1])?' class="do"':'')+'>'+ic(x[0])+'<span>'+esc(x[1])+'</span></li>'}).join('');
 var sc=$('pr-script');sc.innerHTML=c.sc.split(String.fromCharCode(10)).filter(function(t){return t.trim()}).map(function(t){var d=/^[*].*[*]$/.test(t);return '<p'+(d?' class="do"':'')+'>'+esc(t.replace(/^[*]|[*]$/g,''))+'</p>'}).join('');sc.parentNode.scrollTop=0;
 $('pr-upnext').textContent=cur+1<N?'Up next: '+C[cur+1].beat:'End of deck';tick()}
function tick(){var el=t0===null?0:(Date.now()-t0)/1000,ck=$('pr-clock'),c=C[cur],end=cur+1<N?C[cur+1].at:300;
 ck.textContent=fmt(el);ck.className=el>300?'over':(t0!==null&&el>end+5?'late':'');
 $('pr-check').textContent=t0===null?'Timer starts on your first Next':(el>end+5?'Behind by '+fmt(el-end)+' · move on':'On time')}
setInterval(tick,500);
var bc=null;try{bc=new BroadcastChannel('vi-pitch-eligent')}catch(e){}
var sent=0;function go(k){k=Math.max(0,Math.min(N-1,k));if(t0===null&&k>0)t0=Date.now();cur=k;sent=Date.now();render();if(bc)bc.postMessage({t:'go',i:cur})}
if(bc){bc.onmessage=function(e){var m=e.data||{};if(m.t==='at'&&typeof m.i==='number'){linked=Date.now();$('pr-link').textContent='Audience window: linked';$('pr-link').className='on';if(m.i!==cur&&Date.now()-sent>600){if(t0===null&&m.i>0)t0=Date.now();cur=Math.max(0,Math.min(N-1,m.i));render()}}};bc.postMessage({t:'hello'})}
else $('pr-link').textContent='This browser cannot link windows';
$('pr-next').addEventListener('click',function(){go(cur+1)});$('pr-prev').addEventListener('click',function(){go(cur-1)});
$('pr-reset').addEventListener('click',function(){t0=null;tick()});
$('pr-open').addEventListener('click',function(){window.open('/pitch-Eligent?present=1','vi-audience','popup,width=1280,height=760');setTimeout(function(){if(bc)bc.postMessage({t:'go',i:cur})},1500)});
document.addEventListener('keydown',function(e){var k=e.key;if(e.target.closest&&e.target.closest('button')&&(k===' '||k==='Enter'))return;
 if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='ArrowDown'){go(cur+1);e.preventDefault()}else if(k==='ArrowLeft'||k==='PageUp'||k==='ArrowUp'){go(cur-1);e.preventDefault()}
 else if(k==='Home'){go(0);e.preventDefault()}else if(k==='End'){go(N-1);e.preventDefault()}});
addEventListener('resize',fit);render();
})();
</script></body></html>
