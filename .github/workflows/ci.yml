name: CI

# Runs the whole suite on pushes and pull requests. Nothing here deploys anything.
# Queue and docs-only pushes skip the suite (owner, 3 Nov 2026). Any other file in the push runs it.
on:
  push:
    branches-ignore: ['backup/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.56.1'

jobs:
  server:
    name: Server logic + migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/run-tests.sh server
        env:
          LOG_DIR: /tmp/vaultit-test-logs
      - name: Cloudflare config is valid (builds the site and bundles the Worker; deploys nothing)
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-test-logs
          path: /tmp/vaultit-test-logs

  browser:
    name: Browser tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
      # The tests were written offline: they mock Supabase and route three.js locally. Keep outside hosts unreachable
      # so a CDN copy of supabase-js (or a font) cannot replace the mocks.
      - name: Keep outside hosts unreachable (as in the offline test environment)
        run: |
          for h in cdn.jsdelivr.net cdnjs.cloudflare.com fonts.googleapis.com fonts.gstatic.com www.google.com logo.clearbit.com loremflickr.com open.er-api.com api.coingecko.com api.metals.live corsproxy.io legpubblzgknxdtvsant.supabase.co query1.finance.yahoo.com query2.finance.yahoo.com; do
            echo "127.0.0.1 $h" | sudo tee -a /etc/hosts > /dev/null
          done
      - run: bash scripts/run-tests.sh browser
        env:
          SHARD: ${{ matrix.shard }}
          JOBS: 2
          LOG_DIR: /tmp/vaultit-test-logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-logs-${{ strategy.job-index }}
          path: /tmp/vaultit-test-logs
