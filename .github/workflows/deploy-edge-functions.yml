name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - release/pioneer-v2
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-auth-email \
            --project-ref legpubblzgknxdtvsant \
            --no-verify-jwt

          supabase functions deploy waitlist-join \
            --project-ref legpubblzgknxdtvsant \
            --no-verify-jwt

          supabase functions deploy stock-quotes \
            --project-ref legpubblzgknxdtvsant \
            --no-verify-jwt

          supabase functions deploy pin-auth \
            --project-ref legpubblzgknxdtvsant \
            --no-verify-jwt

          supabase functions deploy portfolio-vision \
            --project-ref legpubblzgknxdtvsant \
            --no-verify-jwt

          supabase functions deploy house-3d \
            --project-ref legpubblzgknxdtvsant \
            --no-verify-jwt
